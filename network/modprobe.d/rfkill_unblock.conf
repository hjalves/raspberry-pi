# Start new radios unblocked. Overrides raspberrypi-sys-mods' rfkill_default.conf
# (default_state=0, block until a Wi-Fi country is set): the country is set on the
# kernel command line (cfg80211.ieee80211_regdom=PT), so that guard only gets in the
# way of USB Wi-Fi adapters plugged in later. Must sort after rfkill_default.conf;
# modprobe applies both lines in file order and the last value wins.
options rfkill default_state=1
